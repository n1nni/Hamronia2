<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harmonia — Score Editor</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- ════════════════════════════════
     UPLOAD SCREEN
════════════════════════════════ -->
<div id="upload-screen">
  <div class="upload-card">
    <div class="upload-logo">HARMONIA</div>
    <p class="upload-sub">Music Score Editor</p>
    <div id="drop-zone" class="drop-zone">
      <div class="drop-icon">🎼</div>
      <p>Drop your score image here</p>
      <p class="drop-hint">or</p>
      <label class="upload-btn">
        Browse File
        <input type="file" id="file-input" accept="image/*" hidden>
      </label>
      <p class="drop-hint" style="margin-top:12px;font-size:11px;color:#556">JPG, PNG, TIFF supported</p>
    </div>
  </div>
</div>

<!-- ════════════════════════════════
     MAIN EDITOR
════════════════════════════════ -->
<div id="main-screen" class="hidden">

  <!-- Top bar -->
  <header>
    <span class="logo">HARMONIA</span>

    <div class="threshold-group">
      <label>Confidence threshold</label>
      <input type="range" id="threshold-slider" min="0" max="100" value="75">
      <span id="threshold-val">75</span>
      <span class="threshold-legend">
        <span class="dot-blue"></span>≥ threshold
        <span class="dot-red"></span>&lt; threshold
      </span>
    </div>

    <div class="header-right">
      <button class="hbtn" id="zoom-out">−</button>
      <span id="zoom-label">100%</span>
      <button class="hbtn" id="zoom-in">+</button>
      <button class="hbtn" id="reset-btn">Reset</button>
      <button class="hbtn primary" id="download-btn">↓ Download MusicXML</button>
    </div>
  </header>

  <!-- Two-panel body -->
  <div class="panels">

    <!-- LEFT: original image + dot overlay -->
    <div class="panel" id="image-panel">
      <div class="panel-title">Original Image
        <span class="panel-hint">click a dot to edit that note</span>
      </div>
      <div class="image-wrap" id="image-wrap">
        <!-- img-container keeps dot-layer clipped exactly over the image -->
        <div id="img-container">
          <img id="score-img" alt="Uploaded score">
          <div id="dot-layer"></div>
        </div>
      </div>
    </div>

    <!-- RIGHT: regenerated OSMD score -->
    <div class="panel" id="score-panel">
      <div class="panel-title">Regenerated Score</div>
      <div class="score-scroll" id="score-scroll">
        <div id="osmd-container"></div>
      </div>
    </div>

  </div>

  <!-- Bottom: note editor (hidden until note selected) -->
  <div id="note-editor" class="note-editor hidden">
    <div class="editor-header">
      <span id="editor-title">Note Editor</span>
      <button id="editor-close" onclick="closeEditor()">✕</button>
    </div>
    <div id="editor-fields"></div>
  </div>

</div>

<!-- Status toast -->
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.9/build/opensheetmusicdisplay.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
